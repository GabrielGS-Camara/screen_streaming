[package]
name = "screen_streaming"
version = "0.1.0"
description = "Aplicativo de transmissão de tela leve para Windows"
authors = ["Gabriel Câmara"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screen_streaming_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "2"
webrtc = "0.20"
rtc = "0.20"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
openh264 = "0.9"
rand = "0.10"
ffmpeg-next = "9"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
local-ip-address = "0.6"
bytes = "1"
# Not just a dev-dependency: the app embeds and runs this itself (see
# session::spawn_local_signaling_server) so a broadcaster never needs to
# separately run `signaling-server` in a terminal — matches the product
# requirement of not needing to "create a server" like Discord does.
signaling-server = { path = "../signaling-server" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Same optimizations as release, but keeps debug symbols (release's
# `strip = true` would otherwise throw them away) — for profiling tools
# and for debugging release-only behavior (e.g. a bug that only shows up
# under `lto`/`opt-level = 3`) without losing symbol names. Never meant to
# be distributed, unlike [profile.release].
[profile.profiling]
inherits = "release"
debug = true
strip = false
