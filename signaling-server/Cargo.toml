[package]
name = "signaling-server"
version = "0.1.0"
description = "Minimal WebRTC signaling relay for screen_streaming — pairs two clients by a short code and relays SDP/ICE messages between them. Never sees the actual video."
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
