<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Screen Streaming — PiP</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      p {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a49dc9;
        font: 13px "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 0 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <p id="message">Conectando…</p>
    <img id="video" alt="Tela remota transmitida" hidden />
    <script type="module">
      const invoke = window.__TAURI__?.core?.invoke;
      const message = document.querySelector("#message");
      const video = document.querySelector("#video");

      async function load() {
        try {
          const url = await invoke("get_watch_video_url");
          video.src = url;
          video.hidden = false;
          message.hidden = true;
        } catch (err) {
          message.textContent = "Nada sendo assistido no momento.";
          console.error("get_watch_video_url failed:", err);
        }
      }

      load();
    </script>
  </body>
</html>
